aid: lilac-solutions
name: Lilac Solutions
description: 'Lilac Solutions is an Oakland, California climate-technology company founded
  in 2016 that develops direct lithium extraction (DLE) technology built on proprietary
  ion exchange media. Its ion exchange beads and modular brine processing systems pull
  battery-grade lithium from high-grade, low-grade and complex brines without evaporation
  ponds, cutting water use and shrinking the land footprint and time-to-production of
  conventional lithium operations. Lilac operates mini-pilot, field-pilot and commercial
  deployments across the Great Salt Lake in Utah, Nevada, Argentina, Chile, Germany and
  Indonesia, and manufactures its ion exchange media on a dedicated production line in
  Nevada. The company is venture-backed with roughly $350M raised, employs about 200
  people, and sells industrial hardware and process technology to lithium producers —
  it publishes no public developer platform, API, or machine-readable API contract.'
